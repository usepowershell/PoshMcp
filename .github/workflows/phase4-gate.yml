name: Phase 4 Gate (reusable)

# Reusable Phase 4 performance-comparison gate (#357), invoked in two modes:
#
#   * ADVISORY (enforceGate=false) — used by PR/branch CI. A VALID v1.4.1->v2.0.0
#     comparison whose only failure is red performance thresholds does NOT block the PR
#     (the classifier exits 0), but the red status is preserved via prominent annotations
#     and the job summary, and all artifacts are uploaded. INFRASTRUCTURE/METHODOLOGY
#     failures (missing/partial/malformed artifacts, provenance/SDK-pair violation, build
#     or measurement failure, merge-validator failure, methodology-parity mismatch) STILL
#     fail the check.
#
#   * RELEASE (enforceGate=true) — the enforceable gate. Any threshold breach in a valid
#     comparison exits non-zero and stays visibly RED. This is the mode the final release
#     gate (#360) invokes.
#
# The advisory/release decision lives entirely in scripts/Invoke-Phase4Gate.ps1 (a single
# implementation covered by scripts/Test-Phase4Gate.ps1), NOT in broad `continue-on-error`.
#
# How the release gate (#360) consumes this:
#   jobs:
#     release-perf-gate:
#       uses: ./.github/workflows/phase4-gate.yml
#       with:
#         enforceGate: true
#   or manually: Actions -> "Phase 4 Gate (reusable)" -> Run workflow (enforceGate defaults true).
# A red release run is a required, non-bypassable status for #360.

on:
  workflow_call:
    inputs:
      enforceGate:
        description: "true = release gate (breach fails); false = advisory (breach non-blocking)."
        type: boolean
        required: false
        default: false
  workflow_dispatch:
    inputs:
      enforceGate:
        description: "true = release gate (breach fails); false = advisory."
        type: boolean
        required: false
        default: true

permissions:
  contents: read

jobs:
  performance-comparison:
    name: "Phase 4 Performance Comparison (#357)"
    runs-on: ubuntu-latest

    permissions:
      contents: read
      actions: read

    # Three INDEPENDENT paired attempts at the SAME revision SHA (Finding #6/#10).
    # Each attempt is its own matrix job on its own fresh runner — it builds BOTH the
    # pinned v1.4.1 baseline and the v2.0.0 HEAD, so every attempt is a genuine v1-vs-v2
    # pair on one runner from clean processes. These are NOT failed-job reruns.
    #
    # TRUE COUNTERBALANCING (#380 AC1):
    # product_order controls which SDK version's server is built/measured FIRST on the runner:
    #   - baseline_first (v1→v2): Phase 0 characterization runs first, then Phase 4
    #   - current_first (v2→v1): Phase 4 measurement runs first, then Phase 0
    # This ensures JIT/cache/memory ordering effects do not systematically bias one version.
    #
    # phase4_order additionally counterbalances the Stateless/Stateful transport-mode sequence
    # within the Phase 4 measurement step.
    #
    # Predeclared balanced sequence: v1→v2, v2→v1, v1→v2 (2:1 baseline_first, alternating).
    strategy:
      fail-fast: false
      matrix:
        include:
          - attempt: 1
            product_order: "baseline_first"
            phase4_order: "stateless_first"
          - attempt: 2
            product_order: "current_first"
            phase4_order: "stateful_first"
          - attempt: 3
            product_order: "baseline_first"
            phase4_order: "stateless_first"

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Need full history to archive Phase 0 commit

    - name: Resolve gate mode
      run: |
        if [ "${{ inputs.enforceGate }}" = "true" ]; then
          echo "GATE_MODE=release" >> "$GITHUB_ENV"
        else
          echo "GATE_MODE=advisory" >> "$GITHUB_ENV"
        fi
        echo "Gate mode: ${GATE_MODE:-advisory} (enforceGate=${{ inputs.enforceGate }})"
        # Record the TRUE PR head SHA (pull_request events set github.sha to the merge commit).
        echo "PR_HEAD_SHA=${{ github.event.pull_request.head.sha || github.sha }}" >> "$GITHUB_ENV"
        echo "MERGE_SHA=${{ github.sha }}" >> "$GITHUB_ENV"
        # Product order for TRUE counterbalancing (#380 AC1).
        echo "PRODUCT_ORDER=${{ matrix.product_order }}" >> "$GITHUB_ENV"
        echo "Product order: ${{ matrix.product_order }} (attempt ${{ matrix.attempt }})"

    - name: Capture clean-process and environment evidence
      run: |
        echo "Attempt: ${{ matrix.attempt }} (phase4_order=${{ matrix.phase4_order }})"
        echo "== Running dotnet processes (expect none at job start) =="
        pgrep -a dotnet || echo "none"
        echo "== Listening TCP ports =="
        ss -ltnp 2>/dev/null | head -50 || true
        echo "== Memory =="
        free -m || true
        echo "== Inherited DOTNET_/POSHMCP_ env (expect no leakage) =="
        env | grep -iE 'DOTNET_|POSHMCP_' || echo "no dotnet/poshmcp env leakage"

    - name: Capture hardware metadata
      run: |
        CPU_MODEL=$(grep -m1 "model name" /proc/cpuinfo | cut -d: -f2 | xargs || echo "unknown")
        TOTAL_MEM_KB=$(grep MemTotal /proc/meminfo | awk '{print $2}' || echo "0")
        echo "RUNNER_CPU_MODEL=${CPU_MODEL}" >> "$GITHUB_ENV"
        echo "RUNNER_TOTAL_MEM_KB=${TOTAL_MEM_KB}" >> "$GITHUB_ENV"
        echo "Runner CPU: ${CPU_MODEL}"
        echo "Runner memory: ${TOTAL_MEM_KB} kB"
        nproc && uname -r

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.x

    - name: Restore dependencies
      run: dotnet restore

    - name: Build Phase 4 (current HEAD)
      run: dotnet build --configuration Release --no-restore

    # Pin the GENUINE pre-migration (SDK 1.4.1) baseline commit directly.
    #
    # Provenance (verified in git history):
    #   4ccced1  feat: upgrade MCP SDK to v2.0.0   <- migration boundary (1.4.1 -> 2.0.0)
    #   1669686  test: v1 baseline characterization suite (Phase 0 gate) (#364)
    #            ^ immediate PARENT of the migration; PoshMcp.Server references
    #              ModelContextProtocol[.AspNetCore] 1.4.1 AND already carries the
    #              characterization harness. This is the authoritative v1 baseline.
    #
    # The prior workflow resolved the baseline from CI run 30896180897, which pointed at
    # commit cc50524 — a POST-migration commit whose server references MCP 2.0.0. That made
    # Phase 0 and Phase 4 both v2 (a meaningless v2-vs-v2 comparison). Do NOT resolve the
    # baseline from a saved run id; pin the immutable commit and verify its SDK major below.
    - name: Pin Phase 0 baseline commit (genuine SDK 1.4.1)
      run: |
        PHASE0_SHA="16696866441350198bd005199228ca40582af934"
        echo "Pinned Phase 0 (SDK 1.4.1) commit: $PHASE0_SHA"
        # Confirm the commit exists in the fetched history (fetch-depth: 0 above).
        if ! git cat-file -e "${PHASE0_SHA}^{commit}" 2>/dev/null; then
          echo "ERROR: Pinned Phase 0 commit $PHASE0_SHA not found in history."
          exit 1
        fi
        echo "PHASE0_SHA=$PHASE0_SHA" >> "$GITHUB_ENV"

    # Build Phase 0 server from the pinned commit in an isolated directory.
    # This ensures the same runner and .NET toolchain measures both Phase 0 and Phase 4.
    - name: Build Phase 0 server (pinned commit)
      run: |
        PHASE0_DIR="${{ github.workspace }}/phase0-build"
        mkdir -p "$PHASE0_DIR"

        # Archive only PoshMcp.Server/ and its dependencies from the Phase 0 commit.
        # git archive handles missing/extra files gracefully; any build errors are fatal.
        git archive "$PHASE0_SHA" | tar -x -C "$PHASE0_DIR"

        if [ ! -f "$PHASE0_DIR/PoshMcp.sln" ]; then
          echo "ERROR: Phase 0 archive does not contain PoshMcp.sln — commit may be wrong."
          ls -la "$PHASE0_DIR/" || true
          exit 1
        fi

        pushd "$PHASE0_DIR" > /dev/null
        dotnet restore PoshMcp.sln
        dotnet build PoshMcp.Server/ --configuration Release --no-restore
        popd > /dev/null

        PHASE0_DLL="$PHASE0_DIR/PoshMcp.Server/bin/Release/net10.0/PoshMcp.dll"
        if [ ! -f "$PHASE0_DLL" ]; then
          echo "ERROR: Phase 0 server DLL not found after build: $PHASE0_DLL"
          find "$PHASE0_DIR/PoshMcp.Server/bin" -name "*.dll" || true
          exit 1
        fi

        echo "Phase 0 server built: $PHASE0_DLL"
        echo "PHASE0_SERVER_DLL=$PHASE0_DLL" >> "$GITHUB_ENV"

        # Capture SDK provenance for the Phase 0 (baseline) binary: the ModelContextProtocol
        # DLL that ships next to the server. Record its SHA-256 and major version.
        PHASE0_SDK_DLL="$PHASE0_DIR/PoshMcp.Server/bin/Release/net10.0/ModelContextProtocol.dll"
        if [ ! -f "$PHASE0_SDK_DLL" ]; then
          echo "ERROR: Phase 0 ModelContextProtocol.dll not found: $PHASE0_SDK_DLL"
          exit 1
        fi
        PHASE0_SDK_SHA=$(sha256sum "$PHASE0_SDK_DLL" | cut -d' ' -f1)
        # Major version from the pinned commit's csproj (authoritative source of the package ref).
        PHASE0_SDK_REF=$(git show "$PHASE0_SHA:PoshMcp.Server/PoshMcp.csproj" \
          | grep -oE 'ModelContextProtocol"[^>]*Version="[0-9]+' | grep -oE 'Version="[0-9]+' | grep -oE '[0-9]+' | head -n1)
        echo "Phase 0 SDK: ModelContextProtocol v${PHASE0_SDK_REF} sha256=${PHASE0_SDK_SHA}"
        echo "PHASE0_SDK_MAJOR=$PHASE0_SDK_REF" >> "$GITHUB_ENV"
        echo "PHASE0_SDK_SHA=$PHASE0_SDK_SHA" >> "$GITHUB_ENV"

    # Machine gate: the baseline MUST be pre-migration (v1) and HEAD post-migration (v2), and
    # the two SDK binaries MUST differ. This is the guard that would have caught the prior
    # v2-vs-v2 comparison. Mirrors PerformanceComparator.ValidateSdkVersionPair in C#.
    - name: Guard SDK migration pair (v1 baseline vs v2 current)
      run: |
        HEAD_SDK_DLL="${{ github.workspace }}/PoshMcp.Server/bin/Release/net10.0/ModelContextProtocol.dll"
        if [ ! -f "$HEAD_SDK_DLL" ]; then
          echo "ERROR: HEAD ModelContextProtocol.dll not found: $HEAD_SDK_DLL"
          exit 1
        fi
        HEAD_SDK_SHA=$(sha256sum "$HEAD_SDK_DLL" | cut -d' ' -f1)
        HEAD_SDK_MAJOR=$(grep -oE 'ModelContextProtocol"[^>]*Version="[0-9]+' PoshMcp.Server/PoshMcp.csproj \
          | grep -oE 'Version="[0-9]+' | grep -oE '[0-9]+' | head -n1)
        echo "HEAD SDK: ModelContextProtocol v${HEAD_SDK_MAJOR} sha256=${HEAD_SDK_SHA}"
        echo "Baseline SDK major=${PHASE0_SDK_MAJOR} sha256=${PHASE0_SDK_SHA}"

        FAIL=0
        if [ "$PHASE0_SDK_MAJOR" != "1" ]; then
          echo "ERROR: Phase 0 baseline SDK major is '${PHASE0_SDK_MAJOR}', expected 1 (pre-migration 1.4.1)."; FAIL=1
        fi
        if [ "$HEAD_SDK_MAJOR" != "2" ]; then
          echo "ERROR: HEAD SDK major is '${HEAD_SDK_MAJOR}', expected 2 (post-migration 2.0.0)."; FAIL=1
        fi
        if [ "$PHASE0_SDK_MAJOR" = "$HEAD_SDK_MAJOR" ]; then
          echo "ERROR: baseline and HEAD SDK majors are identical (both v${HEAD_SDK_MAJOR}) — not a migration comparison."; FAIL=1
        fi
        if [ "$PHASE0_SDK_SHA" = "$HEAD_SDK_SHA" ]; then
          echo "ERROR: baseline and HEAD ModelContextProtocol.dll have identical SHA-256 — same binary."; FAIL=1
        fi
        if [ "$FAIL" = "1" ]; then
          echo "SDK migration-pair guard FAILED. This blocks a false v2-vs-v2 (or v1-vs-v1) comparison."
          exit 1
        fi
        echo "SDK migration-pair guard passed: baseline v${PHASE0_SDK_MAJOR} vs current v${HEAD_SDK_MAJOR}, distinct binaries."

    # ═══════════════════════════════════════════════════════════════════════════
    # TRUE COUNTERBALANCING (#380 AC1 Revision 2):
    #
    # baseline_first (attempts 1, 3): Phase 0 (v1) full measurement → Phase 4 (v2) full measurement
    # current_first  (attempt 2):     Phase 4 (v2) full measurement → Phase 0 (v1) full measurement
    #
    # "Full measurement" means the complete N=50 warm calls, N=15 throughput bursts, N=5 cold starts.
    # A pre-touch, health probe, or warmup does NOT satisfy counterbalancing.
    #
    # For current_first: Phase 4 runs in COLLECT_ONLY mode (measurement only, deferred comparison).
    # After BOTH Phase 4 and Phase 0 complete, a deferred comparison step produces the gate artifact.
    # ═══════════════════════════════════════════════════════════════════════════

    # ─── BASELINE_FIRST path: Phase 0 (v1) runs first ──────────────────────────
    - name: "Run Phase 0 characterization (baseline_first)"
      if: matrix.product_order == 'baseline_first'
      env:
        POSHMCP_SERVER_DLL: ${{ env.PHASE0_SERVER_DLL }}
        POSHMCP_SAME_JOB_PAIRED: "1"
        GITHUB_SHA: ${{ env.PHASE0_SHA }}
        CHARACTERIZATION_ARTIFACT_PATH: ${{ github.workspace }}/TestResults/phase0-fresh-baseline.json
      run: |
        echo "COLLECTION_ORDER=baseline_first" >> "$GITHUB_ENV"
        echo "V1_COLLECTION_START_EPOCH=$(date +%s)" >> "$GITHUB_ENV"
        dotnet test --no-build --configuration Release \
          --filter "Category=Characterization" \
          --logger "trx;LogFileName=phase0-fresh-baseline.trx" \
          --results-directory ./TestResults
        echo "V1_COLLECTION_END_EPOCH=$(date +%s)" >> "$GITHUB_ENV"

    # ─── CURRENT_FIRST path: Phase 4 (v2) measurement runs first ───────────────
    - name: "Run Phase 4 measurement FIRST (current_first collect-only)"
      if: matrix.product_order == 'current_first'
      continue-on-error: true
      env:
        POSHMCP_REQUIRE_SDK_MIGRATION_PAIR: "1"
        POSHMCP_SAME_JOB_PAIRED: "1"
        PHASE4_COLLECT_ONLY: "1"
        PHASE4_PRODUCT_ORDER: ${{ matrix.product_order }}
        PHASE4_MODE_ORDER: ${{ matrix.phase4_order }}
      run: |
        echo "COLLECTION_ORDER=current_first" >> "$GITHUB_ENV"
        V2_START=$(date +%s)
        echo "V2_COLLECTION_START_EPOCH=$V2_START" >> "$GITHUB_ENV"

        set +e
        run_mode() {
          local mode="$1"
          local lower
          lower=$(echo "$mode" | tr '[:upper:]' '[:lower:]')
          PHASE4_ARTIFACT_PATH="${{ github.workspace }}/TestResults/phase4-${lower}-collect-only.json" \
          dotnet test --no-build --configuration Release \
            --filter "Category=PerformanceComparison&FullyQualifiedName~${mode}" \
            --logger "trx;LogFileName=phase4-${lower}.trx" \
            --results-directory ./TestResults
          return $?
        }
        RC=0
        if [ "${{ matrix.phase4_order }}" = "stateful_first" ]; then
          echo "Mode order for attempt ${{ matrix.attempt }}: Stateful -> Stateless (COLLECT-ONLY)"
          run_mode Stateful;  RC=$(( RC | $? ))
          run_mode Stateless; RC=$(( RC | $? ))
        else
          echo "Mode order for attempt ${{ matrix.attempt }}: Stateless -> Stateful (COLLECT-ONLY)"
          run_mode Stateless; RC=$(( RC | $? ))
          run_mode Stateful;  RC=$(( RC | $? ))
        fi

        V2_END=$(date +%s)
        echo "V2_COLLECTION_END_EPOCH=$V2_END" >> "$GITHUB_ENV"
        echo "Phase 4 collect-only complete (v2 measurement). Duration: $((V2_END - V2_START))s, exit=$RC"
        exit $RC

    - name: "Hash collect-only artifacts (current_first)"
      if: matrix.product_order == 'current_first'
      run: |
        # Compute SHA-256 of each collect-only artifact and export to GITHUB_ENV.
        # These hashes are validated by the fixture in the deferred comparison step
        # to guarantee the pre-collected V2 samples have not been overwritten or corrupted.
        for mode in stateless stateful; do
          artifact="${{ github.workspace }}/TestResults/phase4-${mode}-collect-only.json"
          if [ -f "$artifact" ]; then
            sha=$(sha256sum "$artifact" | cut -d' ' -f1 | tr '[:lower:]' '[:upper:]')
            key="PHASE4_COLLECT_ONLY_$(echo "$mode" | tr '[:lower:]' '[:upper:]')_SHA256"
            echo "${key}=${sha}" >> "$GITHUB_ENV"
            echo "Hashed collect-only artifact for mode=${mode}: ${sha}"
          else
            echo "WARNING: collect-only artifact not found for mode=${mode}: ${artifact}"
          fi
        done

    - name: "Run Phase 0 characterization SECOND (current_first)"
      if: matrix.product_order == 'current_first'
      env:
        POSHMCP_SERVER_DLL: ${{ env.PHASE0_SERVER_DLL }}
        POSHMCP_SAME_JOB_PAIRED: "1"
        GITHUB_SHA: ${{ env.PHASE0_SHA }}
        CHARACTERIZATION_ARTIFACT_PATH: ${{ github.workspace }}/TestResults/phase0-fresh-baseline.json
      run: |
        V1_START=$(date +%s)
        echo "V1_COLLECTION_START_EPOCH=$V1_START" >> "$GITHUB_ENV"
        dotnet test --no-build --configuration Release \
          --filter "Category=Characterization" \
          --logger "trx;LogFileName=phase0-fresh-baseline.trx" \
          --results-directory ./TestResults
        V1_END=$(date +%s)
        echo "V1_COLLECTION_END_EPOCH=$V1_END" >> "$GITHUB_ENV"
        echo "Phase 0 characterization complete (v1 baseline). Duration: $((V1_END - V1_START))s"

    # ─── Validate fresh Phase 0 baseline (both paths) ────────────────────────
    - name: Validate fresh Phase 0 baseline and export path
      if: always()
      run: |
        FRESH_JSON="${{ github.workspace }}/TestResults/phase0-fresh-baseline.json"
        if [ ! -f "$FRESH_JSON" ]; then
          echo "ERROR: Fresh Phase 0 baseline not found — characterization step may have failed."
          exit 1
        fi

        BASE_SDK_MAJOR=$(jq -r '.sdkAssembly.majorVersion // 0' "$FRESH_JSON")
        BASE_SDK_SHA=$(jq -r '.sdkAssembly.sha256 // ""' "$FRESH_JSON")
        echo "Fresh baseline runtime-detected SDK: major=${BASE_SDK_MAJOR} sha256=${BASE_SDK_SHA}"
        if [ "$BASE_SDK_MAJOR" != "1" ]; then
          echo "ERROR: fresh Phase 0 baseline runtime SDK major is '${BASE_SDK_MAJOR}', expected 1."
          exit 1
        fi

        FRESH_WARM_N=$(jq -r '[.scenarios[] | select(.scenario == "warm_call_latency_ms")] | .[0].iterations // 0' "$FRESH_JSON")
        if [ "$FRESH_WARM_N" = "0" ]; then
          echo "ERROR: fresh Phase 0 baseline has zero warm-call iterations — measurement failed."
          exit 1
        fi
        echo "Fresh Phase 0 baseline warm-call N=$FRESH_WARM_N"
        echo "V1_BASELINE_PATH=$FRESH_JSON" >> "$GITHUB_ENV"

    # ─── BASELINE_FIRST: Phase 4 (v2) runs SECOND (with comparison) ────────────
    - name: "Run Phase 4 Performance Comparison (baseline_first)"
      if: matrix.product_order == 'baseline_first'
      continue-on-error: true
      env:
        POSHMCP_REQUIRE_SDK_MIGRATION_PAIR: "1"
        POSHMCP_SAME_JOB_PAIRED: "1"
        PHASE4_PRODUCT_ORDER: ${{ matrix.product_order }}
        PHASE4_MODE_ORDER: ${{ matrix.phase4_order }}
      run: |
        V2_START=$(date +%s)
        echo "V2_COLLECTION_START_EPOCH=$V2_START" >> "$GITHUB_ENV"
        echo "PHASE4_OBSERVED_PRODUCT_ORDER=baseline_first" >> "$GITHUB_ENV"

        set +e
        run_mode() {
          local mode="$1"
          local lower
          lower=$(echo "$mode" | tr '[:upper:]' '[:lower:]')
          PHASE4_ARTIFACT_PATH="${{ github.workspace }}/TestResults/phase4-${lower}.json" \
          dotnet test --no-build --configuration Release \
            --filter "Category=PerformanceComparison&FullyQualifiedName~${mode}" \
            --logger "trx;LogFileName=phase4-${lower}.trx" \
            --results-directory ./TestResults
          return $?
        }
        RC=0
        if [ "${{ matrix.phase4_order }}" = "stateful_first" ]; then
          echo "Mode order for attempt ${{ matrix.attempt }}: Stateful -> Stateless"
          run_mode Stateful;  RC=$(( RC | $? ))
          run_mode Stateless; RC=$(( RC | $? ))
        else
          echo "Mode order for attempt ${{ matrix.attempt }}: Stateless -> Stateful"
          run_mode Stateless; RC=$(( RC | $? ))
          run_mode Stateful;  RC=$(( RC | $? ))
        fi
        V2_END=$(date +%s)
        echo "V2_COLLECTION_END_EPOCH=$V2_END" >> "$GITHUB_ENV"
        echo "Phase 4 comparison step exit code: $RC (v2 duration: $((V2_END - V2_START))s)"
        exit $RC

    # ─── CURRENT_FIRST: Deferred comparison after both measurements complete ────
    # Phase 4 collect-only ran FIRST (above). Phase 0 ran SECOND.
    # The deferred comparison loads the pre-collected V2 samples via PHASE4_LOAD_SAMPLES_FROM
    # and validates them against the hashes captured in the hash step.
    # It does NOT re-run Phase 4 measurement (fail-closed if artifacts missing or hash mismatch).
    - name: "Run Phase 4 deferred comparison (current_first)"
      if: matrix.product_order == 'current_first'
      continue-on-error: true
      env:
        POSHMCP_REQUIRE_SDK_MIGRATION_PAIR: "1"
        POSHMCP_SAME_JOB_PAIRED: "1"
        PHASE4_PRODUCT_ORDER: ${{ matrix.product_order }}
        PHASE4_MODE_ORDER: ${{ matrix.phase4_order }}
        PHASE4_OBSERVED_PRODUCT_ORDER: "current_first"
        # Tell the fixture to load pre-collected V2 samples from this directory.
        # The fixture validates each artifact's SHA-256 against the env vars set by the hash step.
        PHASE4_LOAD_SAMPLES_FROM: ${{ github.workspace }}/TestResults
        PHASE4_COLLECT_ONLY_STATELESS_SHA256: ${{ env.PHASE4_COLLECT_ONLY_STATELESS_SHA256 }}
        PHASE4_COLLECT_ONLY_STATEFUL_SHA256: ${{ env.PHASE4_COLLECT_ONLY_STATEFUL_SHA256 }}
      run: |
        echo "PHASE4_OBSERVED_PRODUCT_ORDER=current_first" >> "$GITHUB_ENV"
        set +e
        run_mode() {
          local mode="$1"
          local lower
          lower=$(echo "$mode" | tr '[:upper:]' '[:lower:]')
          PHASE4_ARTIFACT_PATH="${{ github.workspace }}/TestResults/phase4-${lower}.json" \
          dotnet test --no-build --configuration Release \
            --filter "Category=PerformanceComparison&FullyQualifiedName~${mode}" \
            --logger "trx;LogFileName=phase4-${lower}.trx" \
            --results-directory ./TestResults
          return $?
        }
        RC=0
        if [ "${{ matrix.phase4_order }}" = "stateful_first" ]; then
          echo "Mode order for attempt ${{ matrix.attempt }}: Stateful -> Stateless (deferred comparison)"
          run_mode Stateful;  RC=$(( RC | $? ))
          run_mode Stateless; RC=$(( RC | $? ))
        else
          echo "Mode order for attempt ${{ matrix.attempt }}: Stateless -> Stateful (deferred comparison)"
          run_mode Stateless; RC=$(( RC | $? ))
          run_mode Stateful;  RC=$(( RC | $? ))
        fi
        echo "Phase 4 deferred comparison exit code: $RC"
        exit $RC

    # ─── Validate collection order (fail-closed) ───────────────────────────────
    - name: Validate collection order epochs
      if: always()
      run: |
        echo "Collection order: ${COLLECTION_ORDER}"
        echo "V1 start: ${V1_COLLECTION_START_EPOCH:-not_set}, V1 end: ${V1_COLLECTION_END_EPOCH:-not_set}"
        echo "V2 start: ${V2_COLLECTION_START_EPOCH:-not_set}, V2 end: ${V2_COLLECTION_END_EPOCH:-not_set}"

        if [ "$COLLECTION_ORDER" = "current_first" ]; then
          # V2 must have COMPLETED before V1 started
          if [ -n "$V2_COLLECTION_END_EPOCH" ] && [ -n "$V1_COLLECTION_START_EPOCH" ]; then
            if [ "$V2_COLLECTION_END_EPOCH" -gt "$V1_COLLECTION_START_EPOCH" ]; then
              echo "ERROR: current_first order violated — V2 end ($V2_COLLECTION_END_EPOCH) > V1 start ($V1_COLLECTION_START_EPOCH)"
              echo "Collections overlapped or were misordered. This is a methodology failure."
              exit 2
            fi
            echo "PASS: V2 completed ($V2_COLLECTION_END_EPOCH) before V1 started ($V1_COLLECTION_START_EPOCH)"
          else
            echo "ERROR: Missing collection timestamps for current_first validation."
            exit 2
          fi
        elif [ "$COLLECTION_ORDER" = "baseline_first" ]; then
          # V1 must have COMPLETED before V2 started
          if [ -n "$V1_COLLECTION_END_EPOCH" ] && [ -n "$V2_COLLECTION_START_EPOCH" ]; then
            if [ "$V1_COLLECTION_END_EPOCH" -gt "$V2_COLLECTION_START_EPOCH" ]; then
              echo "ERROR: baseline_first order violated — V1 end ($V1_COLLECTION_END_EPOCH) > V2 start ($V2_COLLECTION_START_EPOCH)"
              echo "Collections overlapped or were misordered. This is a methodology failure."
              exit 2
            fi
            echo "PASS: V1 completed ($V1_COLLECTION_END_EPOCH) before V2 started ($V2_COLLECTION_START_EPOCH)"
          else
            echo "ERROR: Missing collection timestamps for baseline_first validation."
            exit 2
          fi
        else
          echo "ERROR: Unknown collection order: ${COLLECTION_ORDER}"
          exit 2
        fi

    # Merge the two mode artifacts into one combined artifact.
    # Runs even when tests fail so CI always has an artifact to upload/inspect.
    # A missing/partial merge is an INFRASTRUCTURE failure and exits non-zero in BOTH modes.
    - name: Merge Phase 4 comparison artifacts
      if: always()
      run: |
        STATELESS="${{ github.workspace }}/TestResults/phase4-stateless.json"
        STATEFUL="${{ github.workspace }}/TestResults/phase4-stateful.json"
        COMBINED="${{ github.workspace }}/TestResults/phase4-comparison.json"

        if [ -f "$STATELESS" ] && [ -f "$STATEFUL" ]; then
          # sameJobPaired must be derived, never hardcoded. Require BOTH per-mode inputs to be
          # present and true (mirrors Phase4MergeValidator.MergeSameJobPaired in C#). A missing
          # or false flag fails the merge deterministically — the merged artifact must never
          # claim same-job pairing that the measurements did not actually report.
          SL_PAIR=$(jq -r 'if has("sameJobPaired") then (.sameJobPaired|tostring) else "missing" end' "$STATELESS")
          SF_PAIR=$(jq -r 'if has("sameJobPaired") then (.sameJobPaired|tostring) else "missing" end' "$STATEFUL")
          echo "Per-mode sameJobPaired: stateless=$SL_PAIR stateful=$SF_PAIR"
          if [ "$SL_PAIR" != "true" ] || [ "$SF_PAIR" != "true" ]; then
            echo "ERROR: sameJobPaired merge failed — both modes must report sameJobPaired=true."
            echo "  stateless=$SL_PAIR stateful=$SF_PAIR (missing or false is not authoritative)."
            exit 1
          fi

          # Record BOTH the true PR head SHA and the merge SHA in artifact provenance.
          # Use PHASE4_OBSERVED_PRODUCT_ORDER (derived from actual execution timestamps)
          # rather than trusting the matrix label for observedProductOrder (#380 AC1).
          OBSERVED_ORDER="${PHASE4_OBSERVED_PRODUCT_ORDER:-$PRODUCT_ORDER}"
          jq -s --arg prHead "$PR_HEAD_SHA" --arg mergeSha "$MERGE_SHA" --arg productOrder "$PRODUCT_ORDER" --arg observedOrder "$OBSERVED_ORDER" --arg modeOrder "${{ matrix.phase4_order }}" '
            {
              schemaVersion:      .[0].schemaVersion,
              capturedAt:         .[1].capturedAt,
              sdkPackageVersion:  .[0].sdkPackageVersion,
              sdkAssembly:        .[0].sdkAssembly,
              commitSha:          .[0].commitSha,
              prHeadSha:          $prHead,
              mergeSha:           $mergeSha,
              runtimeInfo:        .[0].runtimeInfo,
              baselineProvenance: .[0].baselineProvenance,
              sameJobPaired:      (.[0].sameJobPaired and .[1].sameJobPaired),
              plannedProductOrder: $productOrder,
              observedProductOrder: $observedOrder,
              modeOrder:          $modeOrder,
              methodologyContract: .[0].methodologyContract,
              baselineMethodologyContract: .[0].baselineMethodologyContract,
              methodologyValidation: ((.[0].methodologyValidation // []) + (.[1].methodologyValidation // []) | unique),
              statisticalReports: ((.[0].statisticalReports // []) + (.[1].statisticalReports // [])),
              stageAttributions:  ((.[0].stageAttributions // []) + (.[1].stageAttributions // [])),
              modes:              (.[0].modes + .[1].modes),
              warnings:           (.[0].warnings + .[1].warnings | unique),
              overallPassed:      (.[0].overallPassed and .[1].overallPassed),
              exitCode:           (if (.[0].overallPassed and .[1].overallPassed) then 0 else 1 end)
            }
          ' "$STATELESS" "$STATEFUL" > "$COMBINED"
          echo "Merged Phase 4 artifact written to $COMBINED (prHeadSha=$PR_HEAD_SHA mergeSha=$MERGE_SHA)"
          jq -r '
            "overallPassed=\(.overallPassed) exitCode=\(.exitCode) sameJobPaired=\(.sameJobPaired)",
            (.modes[] | "  mode=\(.transportMode) allPassed=\(.allPassed)")
          ' "$COMBINED"
        elif [ -f "$STATELESS" ]; then
          cp "$STATELESS" "$COMBINED"
          echo "WARNING: Stateful artifact missing; combined artifact contains Stateless only."
          echo "ERROR: A partial merge is not authoritative — both modes are required."
          exit 1
        elif [ -f "$STATEFUL" ]; then
          cp "$STATEFUL" "$COMBINED"
          echo "WARNING: Stateless artifact missing; combined artifact contains Stateful only."
          echo "ERROR: A partial merge is not authoritative — both modes are required."
          exit 1
        else
          echo "ERROR: No Phase 4 mode artifacts produced — merge cannot proceed."
          exit 1
        fi

    # Classify the comparison and enforce the gate per mode. This is the enforcer:
    #   * INFRA/METHODOLOGY failure (missing/partial/malformed/provenance/SDK-pair/parity/
    #     unmeasured/inconsistent) -> non-zero in BOTH advisory and release.
    #   * valid comparison + only red thresholds -> advisory: exit 0 (annotations + summary
    #     preserve RED); release: exit 1 (RED).
    - name: Classify Phase 4 gate (advisory on PR / release when enforced)
      if: always()
      shell: pwsh
      run: |
        Write-Host "Gate mode: $env:GATE_MODE"
        ./scripts/Invoke-Phase4Gate.ps1 `
          -MergedArtifactPath "${{ github.workspace }}/TestResults/phase4-comparison.json" `
          -Mode "$env:GATE_MODE" `
          -BaselineArtifactPath "${{ github.workspace }}/TestResults/phase0-fresh-baseline.json"

    # Generate artifact manifest with SHA-256 hashes for completeness verification (#380 AC4).
    # Includes per-attempt raw artifacts, DLL provenance, and effective configs.
    - name: Generate artifact manifest
      if: always()
      run: |
        MANIFEST="${{ github.workspace }}/TestResults/artifact-manifest.json"
        echo '{"manifest_version":"2.0","attempt":${{ matrix.attempt }},"product_order":"${{ matrix.product_order }}","observed_product_order":"'"${PHASE4_OBSERVED_PRODUCT_ORDER:-unknown}"'","collection_order":"'"${COLLECTION_ORDER:-unknown}"'","mode_order":"${{ matrix.phase4_order }}","source_head":"'"$PR_HEAD_SHA"'","merge_sha":"'"$MERGE_SHA"'","v1_collection_start_epoch":'"${V1_COLLECTION_START_EPOCH:-0}"',"v1_collection_end_epoch":'"${V1_COLLECTION_END_EPOCH:-0}"',"v2_collection_start_epoch":'"${V2_COLLECTION_START_EPOCH:-0}"',"v2_collection_end_epoch":'"${V2_COLLECTION_END_EPOCH:-0}"',"files":[' > "$MANIFEST"
        FIRST=true
        # Core artifacts + TRX + DLL provenance
        for f in \
          TestResults/phase4-comparison.json \
          TestResults/phase4-stateless.json \
          TestResults/phase4-stateful.json \
          TestResults/phase0-fresh-baseline.json \
          TestResults/phase4-stateless.trx \
          TestResults/phase4-stateful.trx \
          TestResults/phase0-fresh-baseline.trx \
          PoshMcp.Server/bin/Release/net10.0/PoshMcp.dll \
          PoshMcp.Server/bin/Release/net10.0/ModelContextProtocol.dll \
          ; do
          FULL="${{ github.workspace }}/$f"
          if [ -f "$FULL" ]; then
            SHA=$(sha256sum "$FULL" | cut -d' ' -f1)
            SIZE=$(stat --printf="%s" "$FULL" 2>/dev/null || stat -f "%z" "$FULL" 2>/dev/null || echo "0")
            if [ "$FIRST" = "true" ]; then FIRST=false; else echo ',' >> "$MANIFEST"; fi
            echo "{\"path\":\"$f\",\"sha256\":\"$SHA\",\"size\":$SIZE}" >> "$MANIFEST"
          fi
        done
        # Phase 0 DLLs (from the pinned baseline build)
        if [ -n "$PHASE0_SERVER_DLL" ] && [ -f "$PHASE0_SERVER_DLL" ]; then
          PHASE0_DIR=$(dirname "$PHASE0_SERVER_DLL")
          for dll in "$PHASE0_SERVER_DLL" "$PHASE0_DIR/ModelContextProtocol.dll"; do
            if [ -f "$dll" ]; then
              SHA=$(sha256sum "$dll" | cut -d' ' -f1)
              SIZE=$(stat --printf="%s" "$dll" 2>/dev/null || stat -f "%z" "$dll" 2>/dev/null || echo "0")
              RELPATH=$(echo "$dll" | sed "s|${{ github.workspace }}/||")
              echo ',' >> "$MANIFEST"
              echo "{\"path\":\"$RELPATH\",\"sha256\":\"$SHA\",\"size\":$SIZE}" >> "$MANIFEST"
            fi
          done
        fi
        echo ']}' >> "$MANIFEST"
        echo "Artifact manifest:"
        cat "$MANIFEST"

    - name: Upload Phase 4 Comparison Artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        # Unique per-attempt name including product order — no overwrite (#380 AC4).
        name: phase4-comparison-${{ env.GATE_MODE }}-attempt-${{ matrix.attempt }}-${{ matrix.product_order }}
        if-no-files-found: warn
        path: |
          TestResults/phase4-comparison.json
          TestResults/phase4-stateless.json
          TestResults/phase4-stateful.json
          TestResults/phase4-stateless.trx
          TestResults/phase4-stateful.trx
          TestResults/phase0-fresh-baseline.json
          TestResults/phase0-fresh-baseline.trx
          TestResults/artifact-manifest.json
