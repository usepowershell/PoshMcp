name: Soak Test

# Authoritative sustained-load soak + handle/memory stability run for issue #349.
#
# This workflow runs on windows-latest because the authoritative handle signal is
# Process.HandleCount (a Windows-specific metric). It is manual/nightly only and is
# NEVER part of ordinary PR CI (the SoakTest carries [Trait("Category","Soak")], which
# PR CI excludes). The full release run is ~74 minutes of wall clock
# (baseline 3 + warmup 5 + load 61 + cooldown 5).
#
# Diagnostic / investigation runs can request a longer cooldown (15-30 min) via
# cooldown_minutes and enable burst-scaling exercises via burst_workers. Production
# defaults are preserved; these inputs do not affect the acceptance thresholds.

on:
  workflow_dispatch:
    inputs:
      load_minutes:
        description: "Measured load-phase minutes (release default 61; must yield >= 60 min measured span)"
        required: false
        default: "61"
      min_load_minutes:
        description: "Minimum measured load span required to pass the duration gate"
        required: false
        default: "60"
      cooldown_minutes:
        description: "Cooldown phase minutes (release default 5; use 15-30 for drift investigation runs)"
        required: false
        default: "5"
      burst_workers:
        description: "Burst concurrency workers interspersed within load phase (0 = disabled, default production)"
        required: false
        default: "0"
      traffic_mode:
        description: "Traffic mode: full_mix (default, PS execution) or tools_list_only (HTTP/MCP comparison, no PS execution)"
        required: false
        default: "full_mix"
  schedule:
    # Nightly at 02:00 UTC on weekdays
    - cron: "0 2 * * 1-5"

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

jobs:
  soak:
    name: Sustained-load soak (#349, windows/HandleCount)
    runs-on: windows-latest
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.x

      - name: Restore
        run: dotnet restore

      - name: Build (Release)
        run: dotnet build --configuration Release --no-restore

      - name: Run soak analyzer unit tests
        run: >
          dotnet test
          --no-build
          --configuration Release
          --filter "FullyQualifiedName~SoakAnalyzerTests"
          --logger "trx;LogFileName=soak-unit.trx"
          --results-directory ./TestResults

      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soak-unit-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: ./TestResults/soak-unit.trx
          if-no-files-found: warn

      - name: Run authoritative soak test (windows-latest, Process.HandleCount)
        timeout-minutes: 160
        env:
          SOAK_ARTIFACT_DIR: ${{ github.workspace }}/soak-artifacts
          SOAK_LOAD_MINUTES: ${{ github.event.inputs.load_minutes || '61' }}
          SOAK_MIN_LOAD_MINUTES: ${{ github.event.inputs.min_load_minutes || '60' }}
          SOAK_COOLDOWN_MINUTES: ${{ github.event.inputs.cooldown_minutes || '5' }}
          SOAK_BURST_WORKERS: ${{ github.event.inputs.burst_workers || '0' }}
          SOAK_TRAFFIC_MODE: ${{ github.event.inputs.traffic_mode || 'full_mix' }}
        run: >
          dotnet test
          --no-build
          --configuration Release
          --filter "Category=Soak"
          --logger "trx;LogFileName=soak-run.trx"
          --results-directory ./TestResults

      - name: Ensure a summary exists (write explicit failed summary if missing)
        if: always()
        run: |
          $dir = "${{ github.workspace }}/soak-artifacts"
          $summary = Get-ChildItem -Path $dir -Recurse -Filter summary.json -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $summary) {
            Write-Host "::warning::No summary.json produced — writing explicit failed summary so evidence is never silently absent."
            $fallbackDir = Join-Path $dir "no-summary-$($env:GITHUB_RUN_ID)"
            New-Item -ItemType Directory -Force -Path $fallbackDir | Out-Null
            $obj = [ordered]@{
              schema         = "poshmcp-soak-v2"
              status         = "FAILED"
              failure_reason = "Soak process did not produce a summary.json (setup/build/crash before artifact write)."
              provenance     = [ordered]@{
                source_commit_sha    = "${{ github.sha }}"
                workflow_run_id      = "${{ github.run_id }}"
                workflow_run_attempt = "${{ github.run_attempt }}"
                workflow_job         = "${{ github.job }}"
                os                   = "windows-latest"
              }
            }
            $obj | ConvertTo-Json -Depth 6 | Set-Content -Path (Join-Path $fallbackDir "summary.json")
          }

      - name: Compute artifact hashes for provenance
        if: always()
        run: |
          $dir = "${{ github.workspace }}/soak-artifacts"
          $hashFile = Join-Path $dir "artifact-hashes.txt"
          $files = Get-ChildItem -Path $dir -Recurse -File -ErrorAction SilentlyContinue |
            Where-Object { $_.Extension -in '.json','.csv','.txt','.trx' }
          $lines = foreach ($f in $files) {
            $hash = (Get-FileHash -Path $f.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($f.FullName.Substring($dir.Length).TrimStart('\/'))"
          }
          $trx = Get-ChildItem -Path ./TestResults -Filter soak-run.trx -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($trx) {
            $hash = (Get-FileHash -Path $trx.FullName -Algorithm SHA256).Hash.ToLower()
            $lines += "$hash  TestResults/soak-run.trx"
          }
          if ($lines) { $lines | Set-Content -Path $hashFile }
          Write-Host "Hashes written to $hashFile"

      - name: Upload soak artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soak-artifacts-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ github.workspace }}/soak-artifacts/**/*
            ./TestResults/soak-run.trx
          if-no-files-found: warn

      - name: Check gate status
        if: always()
        run: |
          $dir = "${{ github.workspace }}/soak-artifacts"
          $summary = Get-ChildItem -Path $dir -Recurse -Filter summary.json -ErrorAction SilentlyContinue |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $summary) {
            Write-Host "::error::No soak summary.json found — soak run did not complete"
            exit 1
          }
          $json = Get-Content -Raw $summary.FullName | ConvertFrom-Json
          $status  = $json.status
          $commit  = $json.provenance.source_commit_sha
          $dirty   = $json.provenance.dirty_working_tree
          $span    = $json.totals.load_span_minutes
          $errors  = $json.totals.error_rate_pct
          Write-Host "Run status: $status (commit=$commit dirty=$dirty load_span=${span}min error_rate=${errors}%)"
          Write-Host "Gates:"
          foreach ($g in $json.gates) {
            Write-Host ("  [{0,-12}] {1,-28} {2}" -f $g.status, $g.gate, $g.detail)
          }
          if ($status -ne "PASSED") {
            Write-Host "::error::Soak gate FAILED — see summary.json in artifacts"
            exit 1
          }
