name: P0 Main

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      commit: ${{ steps.version.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.9'
      - run: python fresh/eng/packages.py version main
        id: version
  checks:
    uses: ./.github/workflows/p0-pr.yml
  native:
    needs: [version, checks]
    uses: ./.github/workflows/p0-native.yml
    with:
      version: ${{ needs.version.outputs.version }}
  publish:
    needs: [version, checks, native]
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    permissions:
      contents: read
      packages: write
    environment: p0-main-packages
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: fresh/global.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.9'
      - uses: actions/download-artifact@v4
        with:
          pattern: package-*-${{ needs.version.outputs.version }}-${{ github.run_attempt }}
          merge-multiple: true
          path: packages
      - name: Validate complete immutable set and publish to GitHub only
        env:
          PACKAGE_VERSION: ${{ needs.version.outputs.version }}
          PACKAGE_COMMIT: ${{ needs.version.outputs.commit }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: python fresh/eng/publish.py main packages "$PACKAGE_VERSION" "$PACKAGE_COMMIT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: immutable-main-${{ needs.version.outputs.version }}
          path: packages
          if-no-files-found: error
          retention-days: 90
