name: CI

on:
  push:
    branches: [ main ]
    paths:
      - '**.cs'
      - '**.csproj'
      - '**.sln'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - '**.cs'
      - '**.csproj'
      - '**.sln'
      - '.github/workflows/ci.yml'

# Minimum permissions for the whole workflow. The build job only needs to read
# repository contents; uploading test result artifacts via actions/upload-artifact@v4
# does not require additional GITHUB_TOKEN scopes. Any future job that needs more
# (e.g. posting check runs, writing PR comments, publishing packages) should
# request those scopes at the job level rather than widening this top-level grant.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.x

    - name: Restore dependencies
      run: dotnet restore

    - name: Verify formatting
      run: dotnet format --verify-no-changes

    - name: Build
      run: dotnet build --configuration Release --no-restore

    # Timing assertions are intentionally excluded from shared CI runners.
    # This verifies that the benchmark suite and its session-affinity coverage
    # are buildable and discoverable without making machine-dependent claims.
    - name: Benchmark contract
      run: |
        dotnet run --no-build --project PoshMcp.Benchmarks --configuration Release -- --verify-http-session-contract | tee benchmark-contract.txt
        dotnet run --no-build --project PoshMcp.Benchmarks --configuration Release -- --list flat | tee benchmark-cases.txt
        for benchmark in FirstHttpSessionLatency WarmSessionToolLatency ConcurrentWarmSessionThroughput BoundedCapacityRejection; do
          grep -Fxq "PoshMcp.Benchmarks.Scenarios.HttpSessionBenchmark.${benchmark}" benchmark-cases.txt
        done

    - name: Upload Benchmark Contract
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: benchmark-contract
        path: |
          benchmark-contract.txt
          benchmark-cases.txt

    # ---------------------------------------------------------------------------
    # Phased test execution per spec 009 (issue #215).
    #
    # The Unit phase stays in the primary build job so formatting/build/unit
    # failures stop the workflow early and preserve the existing required
    # `build` check name. Longer non-unit phases run as separate downstream jobs
    # so Integration, OutOfProcess, Http, Functional, and Azure can execute in
    # parallel once the primary gate passes.
    #
    # Filter strategy: `--filter "Category=X"` matches xUnit
    # `[Trait("Category", "X")]`. While issue #212 (trait rollout) is in flight,
    # tests without a Category trait fall into the default bucket and are
    # excluded from category-scoped phases — those phases will run honestly
    # against whatever is currently labeled. As traits land, each phase
    # automatically picks up its newly-tagged tests.
    # ---------------------------------------------------------------------------

    - name: Test (Unit)
      run: dotnet test --no-build --configuration Release --filter "Category=Unit" --logger "trx;LogFileName=phase-unit.trx" --results-directory ./TestResults

    - name: Upload Unit Test Results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results-unit
        path: ./TestResults/*.trx

  integration:
    name: Test (Integration)
    runs-on: ubuntu-latest
    needs: build

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.x

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --configuration Release --no-restore

    - name: Test (Integration)
      run: dotnet test --no-build --configuration Release --filter "Category=Integration" --logger "trx;LogFileName=phase-integration.trx" --results-directory ./TestResults

    - name: Upload Integration Test Results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results-integration
        path: ./TestResults/*.trx

  outofprocess:
    name: Test (OutOfProcess)
    runs-on: ubuntu-latest
    needs: build

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.x

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --configuration Release --no-restore

    - name: Test (OutOfProcess)
      run: dotnet test --no-build --configuration Release --filter "Category=OutOfProcess" --logger "trx;LogFileName=phase-outofprocess.trx" --results-directory ./TestResults

    - name: Upload OutOfProcess Test Results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results-outofprocess
        path: ./TestResults/*.trx

  http:
    name: Test (Http)
    runs-on: ubuntu-latest
    needs: build

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.x

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --configuration Release --no-restore

    - name: Test (Http)
      run: dotnet test --no-build --configuration Release --filter "Category=Http" --logger "trx;LogFileName=phase-http.trx" --results-directory ./TestResults

    - name: Upload Http Test Results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results-http
        path: ./TestResults/*.trx

  functional:
    name: Test (Functional)
    runs-on: ubuntu-latest
    needs: build

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.x

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --configuration Release --no-restore

    - name: Test (Functional)
      run: dotnet test --blame --no-build --configuration Release --filter "Category=Functional" --logger "trx;LogFileName=phase-functional.trx" --results-directory ./TestResults

    - name: Upload Functional Test Results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results-functional
        path: ./TestResults/*.trx

  azure:
    name: Test (Azure)
    runs-on: ubuntu-latest
    needs: build

    # Job-level env. HAS_AZURE_CREDS is evaluated once at job start by checking
    # whether AZURE_CLIENT_ID secret is non-empty. GitHub Actions does not allow
    # `secrets.X != ''` directly inside step-level `if:` expressions outside of
    # environment contexts, so we project it into env here and gate steps on env.
    env:
      HAS_AZURE_CREDS: ${{ secrets.AZURE_CLIENT_ID != '' }}

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.x

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --configuration Release --no-restore

    # Azure phase: skipped (not failed) when credentials absent. PR builds from
    # forks and any environment without AZURE_CLIENT_ID configured will see this
    # step as "skipped" in the CI UI rather than a hard failure. Credentialed
    # CI for the Azure phase is deferred per spec 009.
    - name: Test (Azure)
      if: ${{ env.HAS_AZURE_CREDS == 'true' }}
      env:
        AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      run: dotnet test --no-build --configuration Release --filter "Category=Azure" --logger "trx;LogFileName=phase-azure.trx" --results-directory ./TestResults

    - name: Test (Azure) — skipped (no credentials)
      if: ${{ env.HAS_AZURE_CREDS != 'true' }}
      run: echo "Azure phase skipped — AZURE_CLIENT_ID secret is not configured for this build."

    - name: Upload Azure Test Results
      if: ${{ always() && env.HAS_AZURE_CREDS == 'true' }}
      uses: actions/upload-artifact@v4
      with:
        name: test-results-azure
        path: ./TestResults/*.trx

  # ---------------------------------------------------------------------------
  # Phase 0 (issue #347): v1 SDK 1.4.1 performance baseline characterization.
  #
  # Runs after the build gate so it has a pre-built server binary.
  # Does NOT fail on timing thresholds — values are observational baselines
  # consumed by Phase 4 (post-v2 upgrade) for relative regression comparison.
  #
  # Artifact: v1-baseline-characterization — contains:
  #   v1-baseline-characterization.json   (structured JSON, see README.md)
  #   phase-characterization.trx          (xUnit pass/fail evidence)
  # ---------------------------------------------------------------------------
  characterization:
    name: "v1 Baseline Characterization (#347)"
    runs-on: ubuntu-latest
    needs: build

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.x

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --configuration Release --no-restore

    - name: Run v1 Baseline Characterization
      env:
        # Absolute path so the test process writes the JSON to the workspace root
        # regardless of the test binary's working directory.
        CHARACTERIZATION_ARTIFACT_PATH: ${{ github.workspace }}/TestResults/v1-baseline-characterization.json
      run: dotnet test --no-build --configuration Release --filter "Category=Characterization" --logger "trx;LogFileName=phase-characterization.trx" --results-directory ./TestResults

    - name: Upload v1 Baseline Characterization Artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: v1-baseline-characterization
        path: |
          TestResults/v1-baseline-characterization.json
          TestResults/phase-characterization.trx

  # ---------------------------------------------------------------------------
  # Phase 4 (issue #357): Performance comparison against Phase 0 baselines.
  #
  # SAME-JOB PAIRED MEASUREMENT DESIGN:
  # To eliminate cross-runner variance and N-mismatch issues, this job measures
  # BOTH the Phase 0 (published baseline commit) and Phase 4 (current HEAD) in
  # the same CI job / same runner process, using identical iteration counts,
  # warmup counts, tool/payload, config, and measurement boundaries.
  #
  # Steps:
  #   1. Capture hardware metadata (CPU model, total memory).
  #   2. Build Phase 4 (current HEAD) server.
  #   3. Download authoritative Phase 0 published baseline (provenance/sanity).
  #   4. Fetch Phase 0 commit SHA from the authoritative CI run.
  #   5. Archive and build the Phase 0 server in an isolated directory.
  #   6. Run Phase 0 characterization with POSHMCP_SERVER_DLL pointing to the
  #      Phase 0 binary — same runner, same test binary, same N.
  #   7. Validate fresh Phase 0 baseline N values against the published artifact.
  #   8. Run Stateless and Stateful comparisons (both use the fresh Phase 0 baseline
  #      as the comparison target; published artifact is provenance evidence only).
  #   9. Upload all artifacts (published Phase 0, fresh Phase 0, per-mode, merged)
  #      with if: always() so gate failures are still diagnosable.
  #
  # Gate failures cause the job to fail (blocking the release).
  #
  # Artifact: phase4-comparison — contains:
  #   phase4-comparison.json       (merged schema poshmcp/v4-comparison/1.0)
  #   phase4-stateless.json        (Stateless-only raw artifact)
  #   phase4-stateful.json         (Stateful-only raw artifact)
  #   phase0-fresh-baseline.json   (same-runner Phase 0 fresh measurement)
  #   phase0-published-baseline.json  (provenance: authoritative published Phase 0)
  #   *.trx                        (xUnit pass/fail evidence per mode)
  # ---------------------------------------------------------------------------
  performance-comparison:
    name: "Phase 4 Performance Comparison (#357)"
    runs-on: ubuntu-latest
    needs: build

    permissions:
      contents: read
      actions: read

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Need full history to archive Phase 0 commit

    - name: Capture hardware metadata
      run: |
        CPU_MODEL=$(grep -m1 "model name" /proc/cpuinfo | cut -d: -f2 | xargs || echo "unknown")
        TOTAL_MEM_KB=$(grep MemTotal /proc/meminfo | awk '{print $2}' || echo "0")
        echo "RUNNER_CPU_MODEL=${CPU_MODEL}" >> "$GITHUB_ENV"
        echo "RUNNER_TOTAL_MEM_KB=${TOTAL_MEM_KB}" >> "$GITHUB_ENV"
        echo "Runner CPU: ${CPU_MODEL}"
        echo "Runner memory: ${TOTAL_MEM_KB} kB"
        nproc && uname -r

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.x

    - name: Restore dependencies
      run: dotnet restore

    - name: Build Phase 4 (current HEAD)
      run: dotnet build --configuration Release --no-restore

    # Download the authoritative Phase 0 published baseline for provenance/sanity.
    # V1_BASELINE_RUN_ID is the authoritative run that captured SDK 1.4.1 metrics.
    - name: Download authoritative Phase 0 published baseline
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        V1_BASELINE_RUN_ID: "30896180897"
      run: |
        echo "Downloading authoritative Phase 0 baseline from run $V1_BASELINE_RUN_ID"
        mkdir -p TestResults/published-baseline

        if ! gh run download "$V1_BASELINE_RUN_ID" \
          --name v1-baseline-characterization \
          --dir TestResults/published-baseline; then
          echo "ERROR: Could not download 'v1-baseline-characterization' from run $V1_BASELINE_RUN_ID."
          echo "  The artifact may have expired (GitHub default retention: 90 days)."
          echo "  If expired, run the characterization job on the Phase 0 commit manually"
          echo "  and update V1_BASELINE_RUN_ID in this workflow."
          exit 1
        fi

        PUBLISHED_JSON="TestResults/published-baseline/v1-baseline-characterization.json"
        if [ ! -f "$PUBLISHED_JSON" ]; then
          echo "ERROR: Artifact downloaded but v1-baseline-characterization.json not found."
          ls -la TestResults/published-baseline/ || true
          exit 1
        fi

        SCHEMA=$(jq -r '.schemaVersion // "missing"' "$PUBLISHED_JSON")
        if [ "$SCHEMA" != "poshmcp/v1-characterization/1.0" ]; then
          echo "ERROR: Published baseline schema mismatch. Expected 'poshmcp/v1-characterization/1.0', got '$SCHEMA'."
          exit 1
        fi

        # Extract N values from published baseline for post-hoc validation of fresh measurement.
        COLD_N=$(jq -r '[.scenarios[] | select(.scenario == "cold_start_http_with_script")] | .[0].iterations // 0' "$PUBLISHED_JSON")
        WARM_N=$(jq -r '[.scenarios[] | select(.scenario == "warm_call_latency_ms")] | .[0].iterations // 0' "$PUBLISHED_JSON")
        TPUT_N=$(jq -r '[.scenarios[] | select(.scenario == "concurrent_throughput_ms")] | .[0].iterations // 0' "$PUBLISHED_JSON")
        echo "Published baseline N: cold=$COLD_N warm=$WARM_N throughput=$TPUT_N"
        echo "PUBLISHED_BASELINE_JSON=${{ github.workspace }}/$PUBLISHED_JSON" >> "$GITHUB_ENV"
        echo "PUBLISHED_COLD_N=$COLD_N" >> "$GITHUB_ENV"
        echo "PUBLISHED_WARM_N=$WARM_N" >> "$GITHUB_ENV"
        echo "PUBLISHED_TPUT_N=$TPUT_N" >> "$GITHUB_ENV"
        cp "$PUBLISHED_JSON" "TestResults/phase0-published-baseline.json"

    # Fetch Phase 0 commit SHA from the authoritative CI run.
    - name: Fetch Phase 0 commit SHA
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        V1_BASELINE_RUN_ID: "30896180897"
      run: |
        PHASE0_SHA=$(gh run view "$V1_BASELINE_RUN_ID" --json headSha --jq '.headSha')
        if [ -z "$PHASE0_SHA" ] || [ "$PHASE0_SHA" = "null" ]; then
          echo "ERROR: Could not retrieve headSha for run $V1_BASELINE_RUN_ID."
          exit 1
        fi
        echo "Phase 0 commit SHA: $PHASE0_SHA"
        echo "PHASE0_SHA=$PHASE0_SHA" >> "$GITHUB_ENV"

    # Build Phase 0 server from the pinned commit in an isolated directory.
    # This ensures the same runner and .NET toolchain measures both Phase 0 and Phase 4.
    - name: Build Phase 0 server (pinned commit)
      run: |
        PHASE0_DIR="${{ github.workspace }}/phase0-build"
        mkdir -p "$PHASE0_DIR"

        # Archive only PoshMcp.Server/ and its dependencies from the Phase 0 commit.
        # git archive handles missing/extra files gracefully; any build errors are fatal.
        git archive "$PHASE0_SHA" | tar -x -C "$PHASE0_DIR"

        if [ ! -f "$PHASE0_DIR/PoshMcp.sln" ]; then
          echo "ERROR: Phase 0 archive does not contain PoshMcp.sln — commit may be wrong."
          ls -la "$PHASE0_DIR/" || true
          exit 1
        fi

        pushd "$PHASE0_DIR" > /dev/null
        dotnet restore PoshMcp.sln
        dotnet build PoshMcp.Server/ --configuration Release --no-restore
        popd > /dev/null

        PHASE0_DLL="$PHASE0_DIR/PoshMcp.Server/bin/Release/net10.0/PoshMcp.dll"
        if [ ! -f "$PHASE0_DLL" ]; then
          echo "ERROR: Phase 0 server DLL not found after build: $PHASE0_DLL"
          find "$PHASE0_DIR/PoshMcp.Server/bin" -name "*.dll" || true
          exit 1
        fi

        echo "Phase 0 server built: $PHASE0_DLL"
        echo "PHASE0_SERVER_DLL=$PHASE0_DLL" >> "$GITHUB_ENV"

    # Run Phase 0 characterization using the Phase 0 binary on this runner.
    # This is the fresh "same-runner" baseline for Phase 4 comparisons.
    # POSHMCP_SERVER_DLL and POSHMCP_SAME_JOB_PAIRED are step-local (not written to GITHUB_ENV)
    # so they do not leak into Phase 4 comparison steps.
    - name: Run Phase 0 characterization (same-runner fresh baseline)
      env:
        POSHMCP_SERVER_DLL: ${{ env.PHASE0_SERVER_DLL }}
        POSHMCP_SAME_JOB_PAIRED: "1"
        GITHUB_SHA: ${{ env.PHASE0_SHA }}
        CHARACTERIZATION_ARTIFACT_PATH: ${{ github.workspace }}/TestResults/phase0-fresh-baseline.json
      run: |
        dotnet test --no-build --configuration Release \
          --filter "Category=Characterization" \
          --logger "trx;LogFileName=phase0-fresh-baseline.trx" \
          --results-directory ./TestResults

    # Validate that the fresh Phase 0 N values match the published baseline.
    # If they differ, the published artifact and fresh measurement are from different
    # methodology versions — the comparator will catch this, but an explicit check here
    # gives a clearer error message at the CI step level.
    - name: Validate Phase 0 fresh vs published N agreement
      run: |
        FRESH_JSON="${{ github.workspace }}/TestResults/phase0-fresh-baseline.json"
        if [ ! -f "$FRESH_JSON" ]; then
          echo "ERROR: Fresh Phase 0 baseline not found — characterization step may have failed."
          exit 1
        fi

        FRESH_COLD_N=$(jq -r '[.scenarios[] | select(.scenario == "cold_start_http_with_script")] | .[0].iterations // 0' "$FRESH_JSON")
        FRESH_WARM_N=$(jq -r '[.scenarios[] | select(.scenario == "warm_call_latency_ms")] | .[0].iterations // 0' "$FRESH_JSON")
        FRESH_TPUT_N=$(jq -r '[.scenarios[] | select(.scenario == "concurrent_throughput_ms")] | .[0].iterations // 0' "$FRESH_JSON")

        echo "Fresh N: cold=$FRESH_COLD_N warm=$FRESH_WARM_N throughput=$FRESH_TPUT_N"
        echo "Published N: cold=$PUBLISHED_COLD_N warm=$PUBLISHED_WARM_N throughput=$PUBLISHED_TPUT_N"

        MISMATCH=0
        if [ "$PUBLISHED_COLD_N" != "0" ] && [ "$FRESH_COLD_N" != "$PUBLISHED_COLD_N" ]; then
          echo "WARNING: cold-start N mismatch: published=$PUBLISHED_COLD_N, fresh=$FRESH_COLD_N"
          MISMATCH=1
        fi
        if [ "$PUBLISHED_WARM_N" != "0" ] && [ "$FRESH_WARM_N" != "$PUBLISHED_WARM_N" ]; then
          echo "WARNING: warm-call N mismatch: published=$PUBLISHED_WARM_N, fresh=$FRESH_WARM_N"
          MISMATCH=1
        fi
        if [ "$PUBLISHED_TPUT_N" != "0" ] && [ "$FRESH_TPUT_N" != "$PUBLISHED_TPUT_N" ]; then
          echo "WARNING: throughput N mismatch: published=$PUBLISHED_TPUT_N, fresh=$FRESH_TPUT_N"
          MISMATCH=1
        fi

        if [ "$MISMATCH" = "1" ]; then
          echo "ERROR: N values differ between published and fresh Phase 0 baseline."
          echo "  This means the Phase 0 characterization test methodology changed between"
          echo "  the authoritative run and the current test code. The comparator will also"
          echo "  flag this via ValidateMethodologyMatch. Investigate before proceeding."
          exit 1
        fi

        echo "Phase 0 N values agree with published baseline."
        echo "V1_BASELINE_PATH=${{ github.workspace }}/TestResults/phase0-fresh-baseline.json" >> "$GITHUB_ENV"

    # Run Stateless and Stateful in SEPARATE dotnet test invocations (separate processes).
    # This prevents one mode's cold-start subprocess spawning and GC/thread-pool pressure
    # from contaminating the other mode's warm-call or throughput measurements.
    # Each invocation writes its own artifact file; they are merged in the step below.
    # if: always() ensures Stateful runs even if Stateless fails (independent gates).
    - name: Run Phase 4 Performance Comparison — Stateless
      env:
        PHASE4_ARTIFACT_PATH: ${{ github.workspace }}/TestResults/phase4-stateless.json
      run: |
        dotnet test --no-build --configuration Release \
          --filter "Category=PerformanceComparison&FullyQualifiedName~Stateless" \
          --logger "trx;LogFileName=phase4-stateless.trx" \
          --results-directory ./TestResults

    - name: Run Phase 4 Performance Comparison — Stateful
      if: always()
      env:
        PHASE4_ARTIFACT_PATH: ${{ github.workspace }}/TestResults/phase4-stateful.json
      run: |
        dotnet test --no-build --configuration Release \
          --filter "Category=PerformanceComparison&FullyQualifiedName~Stateful" \
          --logger "trx;LogFileName=phase4-stateful.trx" \
          --results-directory ./TestResults

    # Merge the two mode artifacts into one combined artifact.
    # Runs even when tests fail so CI always has an artifact to upload/inspect.
    - name: Merge Phase 4 comparison artifacts
      if: always()
      run: |
        STATELESS="${{ github.workspace }}/TestResults/phase4-stateless.json"
        STATEFUL="${{ github.workspace }}/TestResults/phase4-stateful.json"
        COMBINED="${{ github.workspace }}/TestResults/phase4-comparison.json"

        if [ -f "$STATELESS" ] && [ -f "$STATEFUL" ]; then
          jq -s '
            {
              schemaVersion:      .[0].schemaVersion,
              capturedAt:         .[1].capturedAt,
              sdkPackageVersion:  .[0].sdkPackageVersion,
              commitSha:          .[0].commitSha,
              runtimeInfo:        .[0].runtimeInfo,
              baselineProvenance: .[0].baselineProvenance,
              sameJobPaired:      true,
              modes:              (.[0].modes + .[1].modes),
              warnings:           (.[0].warnings + .[1].warnings | unique),
              overallPassed:      (.[0].overallPassed and .[1].overallPassed),
              exitCode:           (if (.[0].overallPassed and .[1].overallPassed) then 0 else 1 end)
            }
          ' "$STATELESS" "$STATEFUL" > "$COMBINED"
          echo "Merged Phase 4 artifact written to $COMBINED"
          jq -r '
            "overallPassed=\(.overallPassed) exitCode=\(.exitCode) sameJobPaired=\(.sameJobPaired)",
            (.modes[] | "  mode=\(.transportMode) allPassed=\(.allPassed)")
          ' "$COMBINED"
        elif [ -f "$STATELESS" ]; then
          cp "$STATELESS" "$COMBINED"
          echo "WARNING: Stateful artifact missing; combined artifact contains Stateless only."
        elif [ -f "$STATEFUL" ]; then
          cp "$STATEFUL" "$COMBINED"
          echo "WARNING: Stateless artifact missing; combined artifact contains Stateful only."
        else
          echo "WARNING: No Phase 4 mode artifacts produced."
        fi

    - name: Upload Phase 4 Comparison Artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: phase4-comparison
        path: |
          TestResults/phase4-comparison.json
          TestResults/phase4-stateless.json
          TestResults/phase4-stateful.json
          TestResults/phase4-stateless.trx
          TestResults/phase4-stateful.trx
          TestResults/phase0-fresh-baseline.json
          TestResults/phase0-published-baseline.json
          TestResults/phase0-fresh-baseline.trx

