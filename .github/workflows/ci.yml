name: CI

on:
  push:
    branches: [ main ]
    paths:
      - '**.cs'
      - '**.csproj'
      - '**.sln'
      - '.github/workflows/ci.yml'
      - '.github/workflows/phase4-gate.yml'
      - 'scripts/**'
  pull_request:
    branches: [ main ]
    paths:
      - '**.cs'
      - '**.csproj'
      - '**.sln'
      - '.github/workflows/ci.yml'
      - '.github/workflows/phase4-gate.yml'
      - 'scripts/**'

# Minimum permissions for the whole workflow. The build job only needs to read
# repository contents; uploading test result artifacts via actions/upload-artifact@v4
# does not require additional GITHUB_TOKEN scopes. Any future job that needs more
# (e.g. posting check runs, writing PR comments, publishing packages) should
# request those scopes at the job level rather than widening this top-level grant.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.x

    - name: Restore dependencies
      run: dotnet restore

    - name: Verify formatting
      run: dotnet format --verify-no-changes

    - name: Build
      run: dotnet build --configuration Release --no-restore

    # Timing assertions are intentionally excluded from shared CI runners.
    # This verifies that the benchmark suite and its session-affinity coverage
    # are buildable and discoverable without making machine-dependent claims.
    - name: Benchmark contract
      run: |
        dotnet run --no-build --project PoshMcp.Benchmarks --configuration Release -- --verify-http-session-contract | tee benchmark-contract.txt
        dotnet run --no-build --project PoshMcp.Benchmarks --configuration Release -- --list flat | tee benchmark-cases.txt
        for benchmark in FirstHttpSessionLatency WarmSessionToolLatency ConcurrentWarmSessionThroughput BoundedCapacityRejection; do
          grep -Fxq "PoshMcp.Benchmarks.Scenarios.HttpSessionBenchmark.${benchmark}" benchmark-cases.txt
        done

    - name: Upload Benchmark Contract
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: benchmark-contract
        path: |
          benchmark-contract.txt
          benchmark-cases.txt

    # ---------------------------------------------------------------------------
    # Phased test execution per spec 009 (issue #215).
    #
    # The Unit phase stays in the primary build job so formatting/build/unit
    # failures stop the workflow early and preserve the existing required
    # `build` check name. Longer non-unit phases run as separate downstream jobs
    # so Integration, OutOfProcess, Http, Functional, and Azure can execute in
    # parallel once the primary gate passes.
    #
    # Filter strategy: `--filter "Category=X"` matches xUnit
    # `[Trait("Category", "X")]`. While issue #212 (trait rollout) is in flight,
    # tests without a Category trait fall into the default bucket and are
    # excluded from category-scoped phases — those phases will run honestly
    # against whatever is currently labeled. As traits land, each phase
    # automatically picks up its newly-tagged tests.
    # ---------------------------------------------------------------------------

    - name: Test (Unit)
      run: dotnet test --no-build --configuration Release --filter "Category=Unit" --logger "trx;LogFileName=phase-unit.trx" --results-directory ./TestResults

    - name: Upload Unit Test Results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results-unit
        path: ./TestResults/*.trx

  integration:
    name: Test (Integration)
    runs-on: ubuntu-latest
    needs: build

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.x

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --configuration Release --no-restore

    - name: Test (Integration)
      run: dotnet test --no-build --configuration Release --filter "Category=Integration" --logger "trx;LogFileName=phase-integration.trx" --results-directory ./TestResults

    - name: Upload Integration Test Results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results-integration
        path: ./TestResults/*.trx

  outofprocess:
    name: Test (OutOfProcess)
    runs-on: ubuntu-latest
    needs: build

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.x

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --configuration Release --no-restore

    - name: Test (OutOfProcess)
      run: dotnet test --no-build --configuration Release --filter "Category=OutOfProcess" --logger "trx;LogFileName=phase-outofprocess.trx" --results-directory ./TestResults

    - name: Upload OutOfProcess Test Results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results-outofprocess
        path: ./TestResults/*.trx

  http:
    name: Test (Http)
    runs-on: ubuntu-latest
    needs: build

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.x

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --configuration Release --no-restore

    - name: Test (Http)
      run: dotnet test --no-build --configuration Release --filter "Category=Http" --logger "trx;LogFileName=phase-http.trx" --results-directory ./TestResults

    - name: Upload Http Test Results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results-http
        path: ./TestResults/*.trx

  functional:
    name: Test (Functional)
    runs-on: ubuntu-latest
    needs: build

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.x

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --configuration Release --no-restore

    - name: Test (Functional)
      run: dotnet test --blame --no-build --configuration Release --filter "Category=Functional" --logger "trx;LogFileName=phase-functional.trx" --results-directory ./TestResults

    - name: Upload Functional Test Results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results-functional
        path: ./TestResults/*.trx

  azure:
    name: Test (Azure)
    runs-on: ubuntu-latest
    needs: build

    # Job-level env. HAS_AZURE_CREDS is evaluated once at job start by checking
    # whether AZURE_CLIENT_ID secret is non-empty. GitHub Actions does not allow
    # `secrets.X != ''` directly inside step-level `if:` expressions outside of
    # environment contexts, so we project it into env here and gate steps on env.
    env:
      HAS_AZURE_CREDS: ${{ secrets.AZURE_CLIENT_ID != '' }}

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.x

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --configuration Release --no-restore

    # Azure phase: skipped (not failed) when credentials absent. PR builds from
    # forks and any environment without AZURE_CLIENT_ID configured will see this
    # step as "skipped" in the CI UI rather than a hard failure. Credentialed
    # CI for the Azure phase is deferred per spec 009.
    - name: Test (Azure)
      if: ${{ env.HAS_AZURE_CREDS == 'true' }}
      env:
        AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
        AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      run: dotnet test --no-build --configuration Release --filter "Category=Azure" --logger "trx;LogFileName=phase-azure.trx" --results-directory ./TestResults

    - name: Test (Azure) — skipped (no credentials)
      if: ${{ env.HAS_AZURE_CREDS != 'true' }}
      run: echo "Azure phase skipped — AZURE_CLIENT_ID secret is not configured for this build."

    - name: Upload Azure Test Results
      if: ${{ always() && env.HAS_AZURE_CREDS == 'true' }}
      uses: actions/upload-artifact@v4
      with:
        name: test-results-azure
        path: ./TestResults/*.trx

  # ---------------------------------------------------------------------------
  # Phase 0 (issue #347): v1 SDK 1.4.1 performance baseline characterization.
  #
  # Runs after the build gate so it has a pre-built server binary.
  # Does NOT fail on timing thresholds — values are observational baselines
  # consumed by Phase 4 (post-v2 upgrade) for relative regression comparison.
  #
  # Artifact: v1-baseline-characterization — contains:
  #   v1-baseline-characterization.json   (structured JSON, see README.md)
  #   phase-characterization.trx          (xUnit pass/fail evidence)
  # ---------------------------------------------------------------------------
  characterization:
    name: "v1 Baseline Characterization (#347)"
    runs-on: ubuntu-latest
    needs: build

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.x

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --configuration Release --no-restore

    - name: Run v1 Baseline Characterization
      env:
        # Absolute path so the test process writes the JSON to the workspace root
        # regardless of the test binary's working directory.
        CHARACTERIZATION_ARTIFACT_PATH: ${{ github.workspace }}/TestResults/v1-baseline-characterization.json
      run: dotnet test --no-build --configuration Release --filter "Category=Characterization" --logger "trx;LogFileName=phase-characterization.trx" --results-directory ./TestResults

    - name: Upload v1 Baseline Characterization Artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: v1-baseline-characterization
        path: |
          TestResults/v1-baseline-characterization.json
          TestResults/phase-characterization.trx

  # ---------------------------------------------------------------------------
  # Phase 4 (issue #357): Performance comparison against the genuine SDK 1.4.1 baseline.
  #
  # The full job now lives in the reusable workflow .github/workflows/phase4-gate.yml so the
  # SAME comparison implementation backs both the advisory PR check and the enforceable release
  # gate (#360). On PRs it runs in ADVISORY mode (enforceGate: false): a valid v1.4.1->v2.0.0
  # comparison whose only failure is red performance thresholds does NOT block the PR, but the
  # red status is preserved (annotations + job summary + uploaded artifacts). Infrastructure or
  # methodology failures still fail. The release gate invokes the same workflow with
  # enforceGate: true so any threshold breach stays RED.
  # ---------------------------------------------------------------------------
  performance-comparison:
    name: "Phase 4 Performance Comparison (#357)"
    needs: build
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/phase4-gate.yml
    with:
      enforceGate: false

  # Deterministic checks for the advisory/release classifier (scripts/Invoke-Phase4Gate.ps1).
  # Proves advisory succeeds only for a valid comparison, release fails on a breach, and both
  # modes fail on infra/methodology/provenance/SDK-pair/parity errors (requirement 3).
  phase4-gate-checks:
    name: "Phase 4 Gate Classifier Checks (#357)"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v4
    - name: Run Phase 4 gate classifier checks
      shell: pwsh
      run: ./scripts/Test-Phase4Gate.ps1
